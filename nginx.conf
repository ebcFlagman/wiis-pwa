worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Required temp paths for unprivileged nginx (no write access to /var/cache/nginx)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript application/wasm
               image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Vite outputs content-hashed filenames — cache aggressively
        location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # PWA service worker and manifest must never be cached
        location ~* (sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
        }

        # SPA fallback for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
